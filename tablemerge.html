<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Table Merge</title>
    <link rel="stylesheet" href="tablemerge.css">
</head>
<body>

<table>
    <tr>
        <td rowspan="2">A</td>
        <td>B</td>
        <td colspan="2">C</td>
        <td rowspan="3">D</td>
        <td rowspan="3">E</td>
        <td>N</td>
        <td rowspan="3">H</td>
        <td colspan="2"></td>
    </tr>
    <tr>
        <td rowspan="2">I</td>
        <td>F</td>
        <td>G</td>
        <td rowspan="2">J</td>
        <td rowspan="2">K</td>
        <td rowspan="2">O</td>
    </tr>
    <tr>
        <td colspan="2">M</td>
    </tr>
    <tr>
        <td rowspan="2">P</td>
        <td colspan="2">Q</td>
        <td rowspan="2">R</td>
        <td>U</td>
        <td>V</td>
        <td>W</td>
        <td colspan="3"></td>
    </tr>
    <tr>
        <td>S</td>
        <td>T</td>
        <td>X</td>
        <td>Y</td>
        <td>Z</td>
        <td colspan="3"></td>
    </tr>
</table>

</body>
</html>
