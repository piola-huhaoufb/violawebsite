<!DOCTYPE html>
<html>
    <head>
        <title>Orderlist dan Unorderlist</title>
        <style>
            ul{
                list-style-type: circle;
            }
            ol.a{
                list-style: lower-alpha
            }
            ol{
                background-color: khaki;
            }
        </style>
    </head>
    <body>
        <h2>Menu Makanan</h2>
        <ol>
            <li> Wing Stop</li>
            <ul>
                <li> Wings</li>
            </ul>
            <li> 4 Finggers</li>
            <ol class="a"></ol>
            <li> Cocoichibannya</li>
        </ol>
        <p>Minuman</p>
        <ul>
            <li>Ban ban</li>
            <li> Koi </li>
            <li> Sancha</li>
        </ul>
        <h2>Icon pada HTML</h2>
    </body>
</html>
